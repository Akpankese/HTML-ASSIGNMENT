<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NKESEABASI</title>
  </head>
  <body>
    <header>
      <!-- Global navigation -->
      <nav aria-label="Global navigation">
        <a href="index.html">Home</a>
        <a href="form.html">Apply Here</a>
      </nav>
      <hr />

      <h1>ALTSCHOOL</h1>
    </header>

    <main>
      <!--Sign-up/Sign-in buttons-->
      <form>
        <fieldset>
          <button type="submit" value="Sign-up">Sign-up</button>
          <button type="submit" value="Sign-in">Sign-in</button>
        </fieldset>
      </form>
      <!--Sign-up section-->
      <h2>Sign-up</h2>
      <p>Create an account to get started on your learning journey</p>

      <!---INCLUDE AS IMPORTANT INFORMATION -->
      <p>
        <b
          >Important: Your name will appear on your certificate exactly as
          entered</b
        >
      </p>

      <br />
      <!--form section-->
      <form action="#" method="post">
        <fieldset>
          <p>
            <label for="email"></label>Email<br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Altschoolstudent@email.com"
              required
            />
          </p>

          <p>
            <label for="first-name">First name</label><br />
            <input
              type="text"
              id="first-name"
              name="first-name"
              placeholder="Joshua"
              required
            />
          </p>

          <p>
            <label for="last-name">Last name</label><br />
            <input
              type="text"
              id="last-name"
              name="last-name"
              placeholder="Akpan"
              required
            />
          </p>

          <p>
            <label for="phone">Phone number</label><br />
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+4834567890"
              required
            />
          </p>

          <p>
            <label for="password">Password</label><br />
            <input
              type="password"
              id="password"
              name="password"
              placeholder="********"
              required
            />
          </p>
          <!-- Terms and Privacy -->
          <p>
            <label for="terms"
              >By clicking Create account, I agree to the .....
              <a href="#" target="_blank">Terms of Use</a> and acknowledge that
              I have read the <a href="#" target="_blank"> Privacy Policy</a>.
            </label>
          </p>
          <!-- Submit -->
          <p>
            <button type="submit">Create account</button>
          </p>
        </fieldset>
      </form>
      <section>
        <h2 id="alternative-signup">Or</h2>
        <p>
          <button type="button">Login with Google</button>
        </p>
      </section>
    </main>
    <hr />
    <!-- Footer -->
    <footer>
      <h2>Contact Information</h2>

      <address>
        Szczecin, Poland <br />
        <a href="Akpankese001@gmail.com"> Akpankese001@gmail.com</a>
      </address>

      <b> <p>&copy; 2026 Akpan Joshua Nkeseabasi</p> </b>
    </footer>
  </body>
</html>
